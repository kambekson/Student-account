                    description: OK
                default:
                    $ref: '#/components/responses/Error'
            tags:
                - absenceReasons
        post:
            operationId: createAbsenceReason
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AbsenceReasonCreation'
                required: true
            responses:
                "200":
                    content:
                        application/json:
