                    type: string
                oldPassword:
                    pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[A-Za-z\d\W]{8,25}$
                    type: string
            required:
                - oldPassword
                - newPassword
            type: object
