                    $ref: '#/components/schemas/UUID'
            required:
                - schoolId
                - groupCourseId
                - lessonId
                - teacherId
                - startAt
                - endAt
            type: object
        ScheduledLessonShift:
            properties:
                number:
                    type: integer
            required:
                - number
            type: object
        ScheduledLessonUpdate:
            properties:
                endAt:
                    $ref: '#/components/schemas/DateTime'
                isActive:
                    type: boolean
                startAt:
                    $ref: '#/components/schemas/DateTime'
                teacherId:
                    $ref: '#/components/schemas/UUID'
            type: object
        School:
            properties:
                description:
                    type: string
                domain:
                    minLength: 5
                    type: string
                fileSize:
                    format: int64
                    minimum: 0
                    type: integer
                id:
                    $ref: '#/components/schemas/UUID'
                name:
                    type: string
            required:
                - id
                - name
                - domain
                - fileSize
            type: object
        SchoolCreation:
            properties:
                description:
                    nullable: true
                    type: string
                domain:
                    pattern: ^[a-z0-9][a-z0-9-]{3,13}[a-z0-9]$
                    type: string
                name:
                    type: string
            required:
                - name
                - domain
            type: object
        SchoolUpdate:
            properties:
                description:
                    nullable: true
                    type: string
                name:
                    nullable: true
                    type: string
            type: object
        SchoolUsernames:
            properties:
                usernames:
                    items:
                        type: string
                    type: array
            required:
                - usernames
            type: object
        SetAttendanceRecord:
            properties:
                absenceReasonId:
                    allOf:
                        - $ref: '#/components/schemas/UUID'
                    nullable: true
                isPresent:
                    type: boolean
                proofFileName:
                    nullable: true
                    type: string
                studentId:
                    $ref: '#/components/schemas/UUID'
            required:
                - studentId
                - isPresent
            type: object
        SetAttendanceRecords:
            properties:
                defaultIsPresent:
                    description: Status for students not in the list
                    nullable: true
                    type: boolean
                records:
                    items:
                        $ref: '#/components/schemas/SetAttendanceRecord'
                    type: array
            required:
                - records
            type: object
        SimpleClient:
            properties:
                fields:
                    items:
                        $ref: '#/components/schemas/ClientFieldValue'
                    type: array
                firstName:
                    type: string
                id:
                    $ref: '#/components/schemas/UUID'
                lastName:
                    type: string
                schoolId:
                    $ref: '#/components/schemas/UUID'
                user:
                    $ref: '#/components/schemas/MiniUser'
            required:
                - id
                - firstName
                - lastName
                - schoolId
                - fields
            type: object
        SortDirection:
            enum:
                - asc
                - desc
            type: string
        StudentAssignmentSubmission:
            properties:
                id:
                    $ref: '#/components/schemas/UUID'
                points:
                    type: integer
                status:
                    $ref: '#/components/schemas/AssignmentSubmissionStatus'
            required:
                - id
                - status
                - points
            type: object
        StudentGroupSubscription:
            properties:
                groups:
                    items:
                        $ref: '#/components/schemas/GroupWithSubscriptions'
                    type: array
                student:
                    $ref: '#/components/schemas/MiniClient'
            required:
                - student
                - groups
            type: object
        StudentSchedule:
            properties:
                course:
                    $ref: '#/components/schemas/Course'
                scheduledLesson:
                    $ref: '#/components/schemas/ScheduledLesson'
            required:
                - scheduledLesson
                - course
            type: object
        StudyMaterial:
            properties:
                assignmentId:
                    $ref: '#/components/schemas/UUID'
                description:
                    type: string
                id:
                    $ref: '#/components/schemas/UUID'
                lessonId:
                    $ref: '#/components/schemas/UUID'
                materialFile:
                    $ref: '#/components/schemas/File'
                name:
                    type: string
                order:
                    minimum: 0
                    type: integer
                schoolId:
                    $ref: '#/components/schemas/UUID'
            required:
                - id
                - name
                - order
                - schoolId
            type: object
        StudyMaterialCreation:
            properties:
                assignmentId:
                    allOf:
                        - $ref: '#/components/schemas/UUID'
                    nullable: true
                description:
                    nullable: true
                    type: string
                fileName:
                    nullable: true
                    type: string
                lessonId:
                    allOf:
                        - $ref: '#/components/schemas/UUID'
                    nullable: true
                name:
                    type: string
                schoolId:
                    $ref: '#/components/schemas/UUID'
            required:
                - name
                - schoolId
            type: object
        StudyMaterialUpdate:
            properties:
                description:
                    nullable: true
                    type: string
                name:
                    nullable: true
                    type: string
            type: object
        Subcode:
            description: Error code inside the service
            enum:
                - resource.noAccess
                - entity.noAccess
                - token.invalid
                - token.wrong
                - session.notFound
                - session.userDoesNotMatch
                - cooldown.notElapsed
                - code.tooMany
                - code.wrong
                - code.expired
                - tries.tooMany
                - tokens.tooMany
                - school.domain.alreadyExists
                - school.domain.notFound
                - school.domain.invalid
                - user.notManager
                - user.role.noAccess
                - user.username.invalid
                - user.username.alreadyExists
                - user.password.wrong
                - user.email.notConfirmed
                - user.email.alreadyExists
                - fieldValue.invalid
                - order.alreadyTaken
                - entities.tooMany
                - group.student.alreadyExists
                - group.student.removed
                - group.student.alreadyRemoved
                - group.wallet.notEnoughPoints
                - branch.manager.alreadyExists
                - scheduledLessons.attendance.set
                - scheduledLessons.attendance.get.badValue
                - scheduledLessons.groupCourseId.required
                - student.lessonSubscription.alreadyClosed
                - groupCourse.alreadyCompleted
                - groupCourse.completed
                - groupCourse.schedule.nonUniqueWeekdays
                - groupCourse.schedule.invalid
                - pointType.name.alreadyExists
                - notification.alreadyRead
            type: string
        TeacherReport:
            properties:
                course:
                    $ref: '#/components/schemas/Course'
                group:
                    $ref: '#/components/schemas/GroupWithoutPointType'
                scheduledLesson:
                    $ref: '#/components/schemas/MiniScheduledLesson'
                studentsCount:
                    minimum: 0
                    type: integer
            required:
                - scheduledLesson
                - group
                - course
                - groupCourseId
                - studentsCount
            type: object
        Time:
            format: time
            pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$
            type: string
        Token:
            properties:
                token:
                    type: string
            required:
                - token
            type: object
        Tokens:
            properties:
                access:
                    type: string
                refresh:
                    type: string
            required:
                - access
                - refresh
            type: object
        UTCOffset:
            default: 0
            maximum: 840
            minimum: -720
            type: integer
        UUID:
            format: uuid
            type: string
        User:
            properties:
                avatar:
                    $ref: '#/components/schemas/File'
                clientId:
                    $ref: '#/components/schemas/UUID'
                description:
                    type: string
                firstName:
                    type: string
                id:
                    $ref: '#/components/schemas/UUID'
                language:
                    $ref: '#/components/schemas/Language'
                lastName:
                    type: string
                notificationCount:
                    minimum: 0
                    type: integer
                roles:
                    items:
                        $ref: '#/components/schemas/UserRole'
                    type: array
                schoolId:
                    $ref: '#/components/schemas/UUID'
                username:
                    type: string
            required:
                - id
                - username
                - firstName
                - lastName
                - notificationCount
                - language
                - roles
            type: object
        UserCreation:
            properties:
                clientId:
                    $ref: '#/components/schemas/UUID'
                description:
                    nullable: true
                    type: string
                firstName:
                    type: string
                lastName:
                    type: string
                password:
                    format: password
                    pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[A-Za-z\d\W]{8,25}$
                    type: string
                roles:
                    items:
                        $ref: '#/components/schemas/UserRole'
                    type: array
                schoolId:
                    $ref: '#/components/schemas/UUID'
                username:
                    pattern: ^(?=[a-zA-Z0-9_-]*[a-zA-Z])[a-zA-Z0-9_-]{4,20}$
                    type: string
            required:
                - username
                - password
                - firstName
                - lastName
                - roles
                - schoolId
            type: object
        UserRegistration:
            properties:
                description:
                    nullable: true
                    type: string
                email:
                    format: email
                    type: string
                firstName:
                    type: string
                lastName:
                    type: string
                password:
                    format: password
                    pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[A-Za-z\d\W]{8,25}$
                    type: string
                school:
                    $ref: '#/components/schemas/SchoolCreation'
                token:
                    type: string
                username:
                    pattern: ^(?=[a-zA-Z0-9_-]*[a-zA-Z])[a-zA-Z0-9_-]{4,20}$
                    type: string
            required:
                - username
                - email
                - token
                - firstName
                - lastName
                - password
                - school
            type: object
        UserRegistrationConfirmEmail:
            properties:
                code:
                    type: string
                email:
                    format: email
                    type: string
            required:
                - email
                - code
            type: object
        UserRegistrationEmail:
            properties:
                email:
                    format: email
                    type: string
            required:
                - email
            type: object
        UserRole:
            enum:
                - admin
                - director
                - manager
                - methodist
                - teacher
                - client
            type: string
        UserStudent:
            properties:
                avatar:
                    $ref: '#/components/schemas/File'
                clientId:
                    $ref: '#/components/schemas/UUID'
                description:
                    type: string
                email:
                    format: email
                    type: string
                firstName:
                    type: string
                id:
                    $ref: '#/components/schemas/UUID'
                language:
                    $ref: '#/components/schemas/Language'
                lastName:
                    type: string
                notificationCount:
                    minimum: 0
                    type: integer
                pointWallets:
                    items:
                        $ref: '#/components/schemas/PointWallet'
                    type: array
                schoolId:
                    $ref: '#/components/schemas/UUID'
                totalPoints:
                    format: int64
                    minimum: 0
                    type: integer
                username:
                    type: string
            required:
                - id
                - username
                - firstName
                - lastName
                - notificationCount
                - language
                - schoolId
                - clientId
                - totalPoints
                - pointWallets
            type: object
        UserUpdate:
            properties:
                description:
                    nullable: true
                    type: string
                firstName:
                    nullable: true
                    type: string
                language:
                    $ref: '#/components/schemas/Language'
                lastName:
                    nullable: true
                    type: string
                roles:
                    items:
                        $ref: '#/components/schemas/UserRole'
                    nullable: true
                    type: array
            type: object
        Weekday:
            enum:
                - sunday
                - monday
                - tuesday
                - wednesday
                - thursday
                - friday
                - saturday
            type: string
    securitySchemes:
        bearerAuth:
            bearerFormat: JWT
            scheme: bearer
            type: http
info:
    description: EduSpace LMS API
